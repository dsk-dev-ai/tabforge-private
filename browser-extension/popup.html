<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>TabForge Runtime</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{

--bg:#080d14;
--card:#111827;
--card2:#172233;
--border:#273244;

--text:#fff;
--muted:#8b949e;

--accent:#00d4ff;
--accent2:#3b82f6;

--green:#22c55e;
--red:#ef4444;

}

body{

width:460px;
height:680px;

overflow:hidden;

padding:14px;

font-family:
Inter,
Arial,
sans-serif;

color:var(--text);

background:
linear-gradient(
180deg,
#08111a,
#111827
);

}


/* HEADER */

#header{

padding:16px;

border-radius:20px;

background:

linear-gradient(
145deg,
#101826,
#131d2c
);

border:
1px solid rgba(
255,255,255,.06
);

backdrop-filter:
blur(30px);

box-shadow:

0 0 30px
rgba(
0,212,255,.08
);

}


.titleRow{

display:flex;

justify-content:
space-between;

align-items:center;

}


.logo{

display:flex;

align-items:center;

gap:10px;

font-size:22px;

font-weight:700;

}


.logoBox{

width:38px;

height:38px;

border-radius:12px;

display:flex;

align-items:center;

justify-content:center;

background:

linear-gradient(
135deg,
#00d4ff,
#3b82f6
);

font-weight:800;

}


.badge{

padding:6px 12px;

font-size:11px;

border-radius:40px;

background:

rgba(
255,255,255,.08
);

}



/* STATS */

#top{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:10px;

margin-top:14px;

}


.stat{

padding:10px;

border-radius:14px;

background:

rgba(
255,255,255,.03
);

border:

1px solid rgba(
255,255,255,.04
);

text-align:center;

}


.label{

font-size:10px;

opacity:.6;

}


.value{

font-size:18px;

font-weight:700;

margin-top:4px;

}



/* SEARCH */

.searchWrap{

margin-top:14px;

position:relative;

}


.icon{

position:absolute;

left:14px;

top:12px;

opacity:.6;

}


#search{

width:100%;

padding:
12px
12px
12px
40px;

border-radius:12px;

background:#0d1521;

border:
1px solid var(--border);

color:white;

outline:none;

}


#search:focus{

border-color:
var(--accent);

}




/* STATUS */

#runtime{

margin-top:12px;

padding:12px;

display:flex;

justify-content:
space-between;

align-items:center;

border-radius:12px;

background:

linear-gradient(

90deg,

rgba(
0,212,255,.08
),

rgba(
59,130,246,.08
)

);

}


.live{

display:flex;

gap:8px;

align-items:center;

}


.dot{

width:8px;
height:8px;

background:
var(--green);

border-radius:50%;

animation:
pulse 1.5s infinite;

}


@keyframes pulse{

0%{
opacity:.4;
transform:scale(.8);
}

50%{
opacity:1;
transform:scale(1.4);
}

100%{
opacity:.4;
transform:scale(.8);
}

}



/* BUTTONS */

#toolbar{

display:flex;

gap:8px;

margin-top:14px;

}


button{

flex:1;

padding:10px;

border:none;

border-radius:12px;

cursor:pointer;

color:white;

font-weight:700;

transition:.2s;

}


button:hover{

transform:
translateY(-2px);

}


.primary{

background:

linear-gradient(

90deg,

#00d4ff,

#3b82f6

);

}


.secondary{

background:
#1a2433;

}



/* TABS */

#tabs{

height:340px;

overflow:auto;

margin-top:14px;

padding-right:4px;

}


.tabCard{

padding:12px;

margin-bottom:10px;

border-radius:16px;

border:
1px solid var(--border);

background:

linear-gradient(
180deg,
#131d2a,
#0f1723
);

}


.title{

font-size:13px;

font-weight:700;

margin-bottom:6px;

}


.url{

font-size:10px;

opacity:.6;

overflow:hidden;

text-overflow:ellipsis;

white-space:nowrap;

margin-bottom:8px;

}


.controls{

display:flex;

gap:8px;

}


.start{

background:
var(--green);

}

.stop{

background:
var(--red);

}


.footer{

margin-top:10px;

font-size:10px;

opacity:.4;

text-align:center;

}

</style>

</head>

<body>

<div id="header">

<div class="titleRow">

<div class="logo">

<div class="logoBox">

T

</div>

TabForge

</div>

<div class="badge">

Phase-D

</div>

</div>



<div id="top">

<div class="stat">

<div class="label">

Tabs

</div>

<div
class="value"
id="count"
>

0

</div>

</div>


<div class="stat">

<div class="label">

Recording

</div>

<div
class="value"
id="status"
>

0

</div>

</div>


<div class="stat">

<div class="label">

Sessions

</div>

<div
class="value"
id="runtimeCount"
>

0

</div>

</div>

</div>



<div class="searchWrap">

<div class="icon">

🔍

</div>

<input

id="search"

placeholder="Search tabs..."

>

</div>



<div id="runtime">

<div class="live">

<div class="dot"></div>

Runtime Online

</div>

<div>

WS:8765

</div>

</div>



<div id="toolbar">

<button
class="primary"
id="refreshBtn"
>

Refresh

</button>

<button
class="secondary"
id="stopAll"
>

Stop All

</button>

</div>

</div>



<div id="tabs">

Loading...

</div>


<div class="footer">

TabForge • Rust Session Runtime • Protocol v1

</div>

<script src="popup.js"></script>

</body>

</html>
