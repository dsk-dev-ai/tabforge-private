<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8"/>

<meta
name="viewport"
content="width=device-width,initial-scale=1"
/>

<title>TabForge Runtime</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{

--bg:#080d14;

--card:#111827;

--card2:#172233;

--border:#273244;

--text:#ffffff;

--muted:#8b949e;

--accent:#00d4ff;

--accent2:#3b82f6;

--green:#22c55e;

--red:#ef4444;

}

body{

width:440px;

height:650px;

overflow:hidden;

padding:14px;

font-family:
Inter,
system-ui,
Arial;

color:var(--text);

background:

linear-gradient(
180deg,
#071019,
#0d1520
);

}


/* =======================
HEADER
======================= */

#header{

padding:16px;

border-radius:18px;

background:

linear-gradient(
145deg,
#101826,
#131d2c
);

border:
1px solid rgba(
255,255,255,.06
);

box-shadow:

0 0 30px
rgba(
0,212,255,.07
);

position:sticky;

top:0;

z-index:10;

backdrop-filter:
blur(30px);

}


/* =======================
TITLE
======================= */

.titleRow{

display:flex;

justify-content:
space-between;

align-items:center;

}


.logo{

display:flex;

gap:10px;

align-items:center;

font-size:22px;

font-weight:700;

}


.logoBox{

width:38px;
height:38px;

border-radius:12px;

background:

linear-gradient(
135deg,
#00d4ff,
#3b82f6
);

display:flex;

justify-content:center;

align-items:center;

font-size:18px;

font-weight:bold;

}


.badge{

padding:
5px 10px;

border-radius:30px;

font-size:11px;

background:

rgba(
255,255,255,.08
);

}


/* =======================
STATS
======================= */

#top{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:8px;

margin-top:15px;

}


.stat{

padding:10px;

background:

rgba(
255,255,255,.03
);

border:
1px solid rgba(
255,255,255,.05
);

border-radius:12px;

text-align:center;

}


.label{

font-size:11px;

opacity:.6;

margin-bottom:4px;

}


.value{

font-size:17px;

font-weight:700;

}



/* =======================
SEARCH
======================= */

.searchWrap{

margin-top:12px;

position:relative;

}


.icon{

position:absolute;

left:14px;

top:11px;

opacity:.5;

}


#search{

width:100%;

padding:
12px
14px
12px
42px;

background:
#0d1521;

border:
1px solid
var(--border);

border-radius:12px;

outline:none;

color:white;

}


#search:focus{

border-color:
var(--accent);

}



/* =======================
RUNTIME
======================= */

#runtime{

margin-top:12px;

padding:10px;

border-radius:12px;

background:

linear-gradient(

90deg,

rgba(
0,212,255,.08
),

rgba(
59,130,246,.08
)

);

display:flex;

justify-content:
space-between;

align-items:center;

font-size:12px;

}


.live{

display:flex;

gap:8px;

align-items:center;

}


.dot{

width:8px;

height:8px;

background:
var(--green);

border-radius:50%;

animation:
pulse 1.4s infinite;

}


@keyframes pulse{

0%{

opacity:.4;

transform:
scale(.8);

}

50%{

opacity:1;

transform:
scale(1.4);

}

100%{

opacity:.4;

transform:
scale(.8);

}

}



/* =======================
BUTTONS
======================= */

#toolbar{

display:flex;

gap:8px;

margin-top:12px;

}


button{

flex:1;

border:none;

padding:10px;

border-radius:12px;

cursor:pointer;

font-weight:600;

transition:.25s;

color:white;

}


.primary{

background:

linear-gradient(

90deg,

#00d4ff,

#3b82f6

);

}


.secondary{

background:
#1a2433;

}


button:hover{

transform:
translateY(-2px);

opacity:.95;

}




/* =======================
TABS
======================= */

#tabs{

height:340px;

overflow:auto;

margin-top:14px;

padding-right:4px;

}


#tabs::-webkit-scrollbar{

width:6px;

}


#tabs::-webkit-scrollbar-thumb{

background:
#273244;

border-radius:20px;

}


.tabCard{

background:

linear-gradient(

180deg,

#131d2a,

#0f1723

);

border:

1px solid
var(--border);

border-radius:16px;

padding:12px;

margin-bottom:10px;

transition:.25s;

}


.tabCard:hover{

transform:
translateY(-2px);

border-color:
var(--accent);

}


.title{

font-size:13px;

font-weight:700;

margin-bottom:6px;

}


.url{

font-size:10px;

opacity:.6;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-bottom:10px;

}


.controls{

display:flex;

gap:8px;

}


.start{

background:
var(--green);

}


.stop{

background:
var(--red);

}



/* =======================
FOOTER
======================= */

.footer{

margin-top:10px;

text-align:center;

font-size:10px;

opacity:.4;

}

</style>

</head>

<body>

<div id="header">

<div class="titleRow">

<div class="logo">

<div class="logoBox">

T

</div>

TabForge

</div>

<div class="badge">

v1.2

</div>

</div>



<div id="top">

<div class="stat">

<div class="label">

Tabs

</div>

<div
class="value"
id="count"
>

0

</div>

</div>


<div class="stat">

<div class="label">

Recording

</div>

<div
class="value"
id="status"
>

0

</div>

</div>


<div class="stat">

<div class="label">

Sessions

</div>

<div
class="value"
id="runtimeCount"
>

0

</div>

</div>

</div>



<div class="searchWrap">

<div class="icon">

🔍

</div>

<input

id="search"

placeholder="Search tabs..."

>

</div>



<div id="runtime">

<div class="live">

<div class="dot"></div>

Runtime Online

</div>

<div>

WS:8765

</div>

</div>



<div id="toolbar">

<button

class="primary"

onclick="location.reload()"

>

Refresh

</button>


<button

class="secondary"

id="stopAll"

>

Stop All

</button>

</div>

</div>



<div id="tabs">

Loading...

</div>


<div class="footer">

TabForge Runtime + Rust Stream Engine

</div>

<script src="popup.js"></script>

</body>

</html>
