[package]
name = "desktop-app"
version = "0.2.0"
description = "TabForge Multi-Tab Browser Recording Runtime"
authors = ["dsk-dev-ai"]
edition = "2021"


# ==========================================
# LIB
# ==========================================

[lib]
name = "desktop_app_lib"

crate-type = [
    "staticlib",
    "cdylib",
    "rlib"
]


# ==========================================
# BUILD
# ==========================================

[build-dependencies]

tauri-build = { version="2", features = [] }



# ==========================================
# DEPENDENCIES
# ==========================================

[dependencies]


# ------------------------------------------
# TAURI
# ------------------------------------------

tauri = { version="2", features = [] }

tauri-plugin-opener = "2"



# ------------------------------------------
# SERIALIZATION
# ------------------------------------------

serde = {
    version="1",
    features= ["derive"]
}

serde_json="1"



# ------------------------------------------
# TOKIO
# ------------------------------------------

tokio = {
    version="1",
    features= [
        "full"
    ]
}



# ------------------------------------------
# WEBSOCKET
# ------------------------------------------

tokio-tungstenite = "0.24"

futures-util = "0.3"



# ------------------------------------------
# IDs
# ------------------------------------------

uuid = {
    version="1",
    features= [
        "v4",
        "fast-rng"
    ]
}

rand="0.8"



# ------------------------------------------
# BYTE STREAMING
# ------------------------------------------

bytes="1"



# ------------------------------------------
# CPU
# ------------------------------------------

num_cpus="1"



# ------------------------------------------
# TIME
# ------------------------------------------

chrono="0.4"



# ------------------------------------------
# LOCKS
# ------------------------------------------

parking_lot="0.12"



# ------------------------------------------
# LOGGING
# ------------------------------------------

log="0.4"

env_logger="0.11"



# ==========================================
# RELEASE
# ==========================================

[profile.release]

opt-level=3

lto=true

codegen-units=1

panic="abort"

strip=true



# ==========================================
# DEV
# ==========================================

[profile.dev]

opt-level=0

debug=true
